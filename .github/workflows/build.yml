name: k1-opensbi

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

env:
  ARCH: riscv
  CROSS_COMPILE: riscv64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install software
        run: |
              sudo apt update && \
              sudo apt install -y gdisk dosfstools g++-riscv64-linux-gnu cpp-riscv64-linux-gnu build-essential \
                                  libncurses-dev gawk flex bison openssl libssl-dev tree u-boot-tools \
                                  dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf device-tree-compiler

      - name: Checkout opensbi
        uses: actions/checkout@v6

      - name: opensbi compile
        run: |
              mkdir output
              ${CROSS_COMPILE}gcc -v

              pushd $PWD
                make PLATFORM=generic PLATFORM_DEFCONFIG=k1_defconfig PLATFORM_RISCV_ISA=rv64imafdc_zicsr_zifencei_zicbom -j`nproc`
                cp -v build/platform/generic/firmware/fw_dynamic.itb output/
              popd
              tree ${GITHUB_WORKSPACE}/output

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v6
        with:
          name: k1-opensbi-${{ matrix.name }}
          path: output/fw_dynamic.itb
          retention-days: 30
